{% load static %}
<html lang="nl" data-theme="light" data-font-size="normal">
<html lang="nl">

<head>
    <link rel="icon" type="image/png" href="{% static 'recordings/images/favicon.png' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VGT-Studio{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'recordings/css/style.css' %}">
</head>

<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="{% url 'recording_list' %}" class="logo">
                VGT STUDIO
            </a>
            {% if user.is_authenticated %}
            <nav class="main-nav">

                <div class="nav-dropdown">
                    <a href="{% url 'recording_list' %}" class="nav-dropdown-trigger">
                        Opnames
                    </a>

                    <div class="nav-dropdown-menu">
                        <a href="{% url 'recording_list' %}">
                            Opnames
                        </a>

                        <a href="{% url 'video_review_overview' %}">
                            Videocontrole
                        </a>

                        <a href="{% url 'signbank_export_preview' %}">
                            Signbank Export
                        </a>
                    </div>
                </div>

                <a href="{% url 'signbank_list' %}">
                    Signbank
                </a>
                <a href="{% url 'gebarometer:overview' %}">Gebarometer</a>
                <span class="user-name">
                    {{ user.username }}
                </span>
                <form method="post" action="{% url 'account_logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="logout-button">
                        Uitloggen
                    </button>
                </form>
                <div class="accessibility-controls">
                    <button type="button" id="theme-toggle" aria-label="Wissel tussen lichte en donkere modus">
                        Donker
                    </button>

                    <button type="button" id="font-decrease" aria-label="Verklein tekst">
                        A-
                    </button>

                    <button type="button" id="font-increase" aria-label="Vergroot tekst">
                        A+
                    </button>
                </div>
            </nav>
            {% endif %}
        </div>
    </header>
    <main class="site-main">
        <div class="container">
            {% block content %}
            {% endblock %}
        </div>
    </main>
    <footer class="site-footer">
        <div class="container">
            VGT Studio
        </div>
    </footer>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const html = document.documentElement;

    const themeToggle = document.getElementById("theme-toggle");
    const fontDecrease = document.getElementById("font-decrease");
    const fontIncrease = document.getElementById("font-increase");

    const savedTheme = localStorage.getItem("vgt-theme");
    const savedFontSize = localStorage.getItem("vgt-font-size");

    if (savedTheme) {
        html.setAttribute("data-theme", savedTheme);
    }

    if (savedFontSize) {
        html.setAttribute("data-font-size", savedFontSize);
    }

    function updateThemeButton() {
        const theme = html.getAttribute("data-theme");

        if (theme === "dark") {
            themeToggle.textContent = "Licht";
        } else {
            themeToggle.textContent = "Donker";
        }
    }

    themeToggle.addEventListener("click", function () {
        const currentTheme = html.getAttribute("data-theme");
        const newTheme = currentTheme === "dark" ? "light" : "dark";

        html.setAttribute("data-theme", newTheme);
        localStorage.setItem("vgt-theme", newTheme);

        updateThemeButton();
    });

    const fontSizes = ["normal", "large", "xlarge"];

    fontIncrease.addEventListener("click", function () {
        const current = html.getAttribute("data-font-size") || "normal";
        const index = fontSizes.indexOf(current);

        if (index < fontSizes.length - 1) {
            const newSize = fontSizes[index + 1];
            html.setAttribute("data-font-size", newSize);
            localStorage.setItem("vgt-font-size", newSize);
        }
    });

    fontDecrease.addEventListener("click", function () {
        const current = html.getAttribute("data-font-size") || "normal";
        const index = fontSizes.indexOf(current);

        if (index > 0) {
            const newSize = fontSizes[index - 1];
            html.setAttribute("data-font-size", newSize);
            localStorage.setItem("vgt-font-size", newSize);
        }
    });

    updateThemeButton();
});
</script>
</body>

</html>
