<style>
    #signbank-create-modal {
        width: min(1100px, 95vw);
        max-height: 94vh;
        box-sizing: border-box;
        padding: 24px;
        border: 0;
        border-radius: 12px;
        background: var(--surface-color, white);
        color: var(--text-color, #222);
    }

    #signbank-create-modal::backdrop {
        background: rgba(0, 0, 0, 0.65);
    }

    #signbank-create-modal [hidden] {
        display: none !important;
    }

    .signbank-create-header,
    .signbank-create-actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
    }

    .signbank-create-header {
        justify-content: space-between;
        margin-bottom: 20px;
    }

    .signbank-create-header h2 {
        margin: 0;
    }

    #signbank-create-modal video {
        display: block;
        width: 100%;
        max-height: 56vh;
        margin: 16px 0;
        background: #111;
        border-radius: 8px;
    }

    #signbank-create-details {
        margin: 24px 0 0;
        padding: 0;
        border: 0;
        min-width: 0;
    }

    #signbank-create-modal button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
    #signbank-react-upload-choice:not(:empty) + .signbank-create-actions {
    display: none;
    }

    #signbank-create-modal:has(#signbank-create-choice:not([hidden])) {
        width: min(600px, 94vw);
    }
    #signbank-create-choice > h3 {
        font-family: system-ui, sans-serif;
        font-size: 1.0625rem;
        font-weight: 500;
        line-height: 1.4;
        margin: 0 0 0.875rem;
    }

    #signbank-create-close {
        width: 44px;
        height: 44px;
        padding: 0;
        font-size: 1.5rem;
        line-height: 1;
    }

    #signbank-create-modal:has(#signbank-create-camera:not([hidden])) {
        width: min(860px, 94vw);
    }

    #signbank-create-camera > h3 {
        margin: 0 0 0.75rem;
        font-family: system-ui, sans-serif;
        font-size: 1.125rem;
        font-weight: 500;
    }

    #signbank-create-camera .signbank-camera-frame {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--border-color, #d1d5db);
        border-radius: 14px;
        background: #111827;
    }

    #signbank-create-modal #signbank-create-live {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        max-height: 56vh;
        object-fit: contain;
        margin: 0;
        border-radius: 0;
    }

    #signbank-create-timer,
    .signbank-camera-rec {
        position: absolute;
        padding: 0.3rem 0.55rem;
        border-radius: 6px;
        color: #fff;
        font: 600 0.875rem system-ui, sans-serif;
    }

    #signbank-create-timer {
        right: 12px;
        bottom: 12px;
        background: #111827;
        font-variant-numeric: tabular-nums;
    }

    .signbank-camera-rec {
        display: none;
        top: 12px;
        left: 12px;
        background: #b42318;
    }

    .signbank-camera-actions {
        justify-content: flex-end;
        margin-top: 1rem;
    }

    #signbank-create-camera .signbank-camera-actions button {
        min-height: 44px;
    }

    #signbank-create-start {
        background: #f3705d;
        color: #261511;
    }

    #signbank-create-stop {
        background: #b42318;
        color: #fff;
    }

    #signbank-create-stop:disabled,
    #signbank-create-camera:has(#signbank-create-stop:enabled) #signbank-create-start {
        display: none;
    }

    #signbank-create-camera:has(#signbank-create-stop:enabled) .signbank-camera-rec {
        display: inline-block;
    }

    html[data-reading-mode="true"] #signbank-create-start,
    html[data-reading-mode="true"] #signbank-create-stop {
        background: #ffe500;
        color: #000;
    }

    /* Compacte timer rechtsonder in het camerabeeld */
    #signbank-create-timer {
        right: 14px;
        bottom: 14px;
        min-width: 4rem;
        padding: 0.35rem 0.65rem;
        border: 1px solid #aab3c5;
        border-radius: 999px;
        background: #1c2844;
        color: #fff;
        text-align: center;
        font: 600 0.875rem/1.2 system-ui, sans-serif;
        font-variant-numeric: tabular-nums;
    }

    #signbank-create-camera-back {
        border: 1px solid #6379ab;
        border-radius: 8px;
        background: transparent;
        color: #313f69;
        box-shadow: none;
    }

    html[data-theme="dark"] #signbank-create-camera-back {
        border-color: #a8b9e6;
        color: #c8d5ff;
    }

    html[data-reading-mode="true"] #signbank-create-camera-back {
        border-color: #ffe500;
        color: #ffe500;
    }

    /* Alleen het kruisje is zichtbaar, met een klikvlak van 44 × 44 px */
    #signbank-create-close,
    #signbank-create-close:hover {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        background: transparent;
        box-shadow: none;
        color: var(--text-color, #313f69);
        font: 400 1.75rem/1 system-ui, sans-serif;
    }

    #signbank-create-close:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 2px;
    }

    #signbank-create-modal:has(#signbank-create-camera:not([hidden])) {
        width: min(720px, 94vw);
        padding: clamp(14px, 2vw, 20px);
    }

    #signbank-create-camera .signbank-camera-frame {
        --camera-ratio: 1.333333;
        width: min(100%, calc(44vh * var(--camera-ratio)));
        aspect-ratio: var(--camera-ratio);
        margin-inline: auto;
        border: 0;
        box-shadow: 0 0 0 1px var(--border-color, #d1d5db);
    }

    #signbank-create-modal #signbank-create-live {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        max-height: none;
        aspect-ratio: auto;
        object-fit: contain;
        margin: 0;
    }

    #signbank-create-modal #signbank-create-preview {
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: 44vh;
        margin-inline: auto;
    }

    #signbank-create-modal:has(#signbank-create-review:not([hidden])):has(#signbank-create-details[hidden]) {
        width: min(720px, 94vw);
        padding: clamp(14px, 2vw, 20px);
    }

    #signbank-create-review > h3 {
        margin: 0 0 0.75rem;
        font: 500 1.125rem/1.4 system-ui, sans-serif;
    }

    #signbank-create-modal #signbank-create-preview {
        display: block;
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: 44vh;
        margin: 0 auto;
        border-radius: 14px;
    }

    .signbank-review-actions {
        justify-content: flex-end;
        margin-top: 1rem;
    }

    .signbank-review-actions button {
        min-height: 44px;
    }

    #signbank-create-retry {
        border: 1px solid #6379ab;
        background: transparent;
        color: #313f69;
        box-shadow: none;
    }

    html[data-theme="dark"] #signbank-create-retry {
        border-color: #a8b9e6;
        color: #c8d5ff;
    }

    #signbank-create-continue {
        background: #f3705d;
        color: #261511;
    }

    html[data-reading-mode="true"] #signbank-create-retry {
        border-color: #ffe500;
        color: #ffe500;
    }

    html[data-reading-mode="true"] #signbank-create-continue {
        background: #ffe500;
        color: #000;
    }
</style>

<dialog
    id="signbank-create-modal"
    aria-labelledby="signbank-create-title"
>
    <div class="signbank-create-header">
        <h2 id="signbank-create-title">Nieuw gebaar toevoegen</h2>

        <button
            type="button"
            id="signbank-create-close"
            class="button-secondary"
            aria-label="Venster sluiten"
        >
            <span aria-hidden="true">×</span>
        </button>
    </div>

    <form
        id="signbank-create-form"
        method="post"
        enctype="multipart/form-data"
        action="{% url 'signbank_create' %}"
    >
        {% csrf_token %}

        <p
            id="signbank-create-error"
            class="form-error"
            role="alert"
            hidden
        ></p>

        <p
            id="signbank-create-status"
            role="status"
            aria-live="polite"
        ></p>

        <section id="signbank-create-choice">
            <h3>1. Kies hoe je de video toevoegt</h3>
            <div id="signbank-react-upload-choice"></div>
            <div class="signbank-create-actions">
                <button type="button" id="signbank-create-upload">
                    Video uploaden
                </button>

                <button type="button" id="signbank-create-webcam">
                    Webcamopname maken
                </button>
            </div>
        </section>

        <input
            type="file"
            id="signbank-create-video"
            name="video"
            accept="video/*"
            hidden
        >

        <section id="signbank-create-camera" hidden>
            <h3>Webcamopname</h3>

            <div class="signbank-camera-frame">
                <video id="signbank-create-live" autoplay muted playsinline></video>
                <span class="signbank-camera-rec" aria-hidden="true">● REC</span>
                <span id="signbank-create-timer" aria-hidden="true">00:00</span>
            </div>

            <div class="signbank-create-actions signbank-camera-actions">
                <button type="button" id="signbank-create-camera-back" class="button-secondary">
                    Terug
                </button>

                <button type="button" id="signbank-create-start" disabled>
                    ● Opname starten
                </button>

                <button type="button" id="signbank-create-stop" disabled>
                    ■ Opname stoppen
                </button>
            </div>
        </section>

        <section id="signbank-create-review" hidden>
            <h3>Bekijk je video</h3>

            <video
                id="signbank-create-preview"
                controls
                playsinline
                aria-label="Voorvertoning van je video"
            ></video>

            <div class="signbank-create-actions signbank-review-actions">
                <button type="button" id="signbank-create-retry" class="button-secondary">
                    Opnieuw opnemen
                </button>

                <button type="button" id="signbank-create-continue" disabled>
                    Video gebruiken
                </button>
            </div>
        </section>

        <fieldset id="signbank-create-details" disabled hidden>
            {% include "recordings/_signbank_create_details.html" %}
        </fieldset>
    </form>
</dialog>
