{% extends "recordings/base.html" %}

{% block title %}Nieuw gebaar | VGT Studio{% endblock %}

{% block content %}

        <div>
            <h1>Nieuw gebaar toevoegen</h1>
            <p class="page-intro">
                Upload een video of maak een webcamopname.
            </p>
        </div>

    <button type="button" data-signbank-create>
        Nieuw gebaar toevoegen

    {% include "recordings/_signbank_create_modal.html" %}

    <script

    ></script>

    <script
        src="{% static 'recordings/js/signbank_create_camera.js' %}"
        defer
    ></script>
    <script

    defer
    ></script>
