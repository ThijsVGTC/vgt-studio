{% extends "recordings/base.html" %}

{% block title %}{{ entry.gloss|default:"Signbank-entry" }} | VGT Studio{% endblock %}

{% block content %}
<div
    id="signbank-react-detail"
    data-entry-id="{{ entry.signbank_id }}"
    data-gloss="{{ entry.gloss }}"
    data-detail-url="{% url 'signbank_detail' entry.signbank_id %}"
    data-list-url="{% url 'signbank_list' %}"
></div>

<noscript>
    <p>Schakel JavaScript in om dit gebaar te bekijken en te bewerken.</p>
    <a href="{% url 'signbank_list' %}">Terug naar Signbank</a>
</noscript>
{% endblock %}
