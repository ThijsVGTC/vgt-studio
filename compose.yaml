services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${VGT_STUDIO_PORT:-32769}:8000"
    volumes:
      - ./data:/app/data
      - ./media:/app/media
      - /var/www/vhosts/vlaamsegebarentaal.be/signbank:/app/signbank:ro
      - ./sync_locks:/app/sync_locks
    environment:
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
  signbank_sync:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - /var/www/vhosts/vlaamsegebarentaal.be/signbank:/app/signbank:ro
      - ./sync_locks:/app/sync_locks
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          python -c 'import datetime, time; now = datetime.datetime.now(); wait = 1800 - (now.minute % 30 * 60 + now.second); time.sleep(wait)'
          python manage.py sync_signbank
        done