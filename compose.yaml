services:
  web:
    user: "10002:1003"
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${VGT_STUDIO_PORT:-32769}:8000"
    volumes:
      - ./data:/app/data
      - ./media:/app/media
      - /var/www/vhosts/vlaamsegebarentaal.be/signbank:/app/signbank:rw
      - /var/www/vhosts/vlaamsegebarentaal.be/signbank/writable/glossvideo:/app/signbank/writable/glossvideo:rw
      - ./sync_locks:/app/sync_locks
    environment:
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      SIGNBANK_CRON_TOKEN: ${SIGNBANK_CRON_TOKEN}